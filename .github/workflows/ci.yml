name: Offline tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix .opencode
      - run: npm run test:unit
      - run: |
          node --check src/request/normalize.mjs
          node --check src/entero/policy.mjs
          node --check src/entero/parser.mjs
          node --check src/entero/client.mjs
          node --check src/workflow/contracts.mjs
          node --check .opencode/tools/procurement.js

  xlsx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-xlsx.txt
      - run: python -m unittest discover -s tools -p 'test_xlsx_io.py' -v

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/browser_e2e.py -v
        env:
          E2E_ARTIFACT_DIR: .runtime/browser-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-workbench-evidence
          path: .runtime/browser-artifacts/
